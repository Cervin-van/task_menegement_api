# One image for migrate/api (and worker later): built once, different commands.
x-app: &app
  image: task-manager-api:local
  build:
    context: .
    target: runtime
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tasks}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5440}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # One-shot: migrations run once per deploy, not in every API replica.
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    <<: *app
    command: ["api"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Auto-cancel of overdue tasks: separate process, scaled independently from the API.
  worker:
    <<: *app
    command: ["python", "-m", "app.workers.overdue"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  db_test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks_test
    ports:
      - "127.0.0.1:${DB_TEST_HOST_PORT:-5441}:5432"   # локальний `uv run pytest`
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks_test"]
      interval: 2s
      timeout: 3s
      retries: 15

  tests:
    build:
      context: .
      target: test
    profiles: ["test"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db_test:5432/tasks_test
      JWT_SECRET_KEY: test-secret-key-at-least-32-bytes-long
    depends_on:
      db_test:
        condition: service_healthy

volumes:
  pgdata:
